<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Anna Colliton</title>

    <!-- Adobe Font - tomarik-brush -->
    <link rel="stylesheet" href="https://use.typekit.net/ger2jgy.css">

    <!-- Google Font - Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* MAIN CONTAINER */
        .main-container {
            min-height: 100vh;
            position: relative;
            background-size: cover;
            background-position: center;
            background-color: #FFFEF9;
            transition: background-color 0.5s ease;
        }
        .main-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 248, 231, 0.3);
        }

        /* CONTENT */
        .content-overlay {
            position: relative; 
            z-index: 10; 
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            pointer-events: none;
        }

        /* TITLE */
        .main-title {
            font-family: "tomarik-brush", sans-serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            color: #000;
            margin-bottom: 40px;
            line-height: 1.1;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
            position: relative;
        }
        .main-title:hover { 
            transform: translateY(-3px); 
        }

        /* TAGLINE */
        .tagline {
            font-family: "tomarik-brush", sans-serif;
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: #000;
            display: flex; 
            gap: 20px; 
            align-items: flex-end; 
            justify-content: center;
            pointer-events: auto;
        }
        .tagline-section {
            position: relative; 
            cursor: pointer; 
            transition: all 0.3s ease;
            padding: 10px 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        .tagline-section:hover { 
            transform: translateY(-3px); 
        }
        .tagline-divider { 
            color: #333; 
            opacity: 0.7; 
            align-self: center;
        }

        /* SHOP BUTTON */
        .shop-button-text {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .shop-button-text .small-stack {
            display: flex;
            flex-direction: column;
            line-height: 0.85;
            font-size: clamp(0.6rem, 1.5vw, 1rem);
        }
        .shop-arrow {
            width: 0;
            height: 0;
            border-top: clamp(0.48rem, 1.2vw, 0.8rem) solid transparent;
            border-bottom: clamp(0.48rem, 1.2vw, 0.8rem) solid transparent;
            border-left: clamp(0.48rem, 1.2vw, 0.8rem) solid #000;
            margin-left: 5px;
            transform: translateY(4px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .tagline-section:hover .shop-arrow {
            opacity: 1;
        }

        /* DROPDOWN */
        .dropdown-menu {
            position: absolute;
            top: 100%;
            margin-top: 5px;
            padding: 10px 15px;
            padding-top: 15px;
            border-radius: 10px;
            opacity: 0; 
            visibility: hidden; 
            transform: translateY(-15px);
            transition: all 0.4s ease; 
            min-width: 200px; 
            text-align: center;
        }
        .tagline-section:hover .dropdown-menu {
            opacity: 1; 
            visibility: visible; 
            transform: translateY(0);
        }
        .dropdown-menu a {
            font-family: "tomarik-brush", sans-serif;
            font-size: clamp(0.95rem, 2vw, 1.25rem);
            color: #000; 
            text-decoration: none; 
            display: block; 
            padding: 8px 0;
            transition: all 0.3s ease; 
            white-space: nowrap;
        }
        .dropdown-menu a:hover { 
            transform: translateX(5px); 
            color: #555;
        }

        /* SOCIAL */
        .social-wrapper { 
            position: relative; 
            margin-bottom: 50px; 
            pointer-events: auto; 
        }
        .social-dropdown {
            position: absolute; 
            bottom: 100%; 
            left: 50%;
            transform: translateX(-50%) translateY(15px);
            opacity: 0; 
            visibility: hidden; 
            transition: all 0.4s ease;
            display: flex; 
            gap: 15px; 
            justify-content: center; 
            align-items: center;
            padding: 10px 0; 
            margin-bottom: 10px;
            white-space: nowrap;
        }
        .social-wrapper:hover .social-dropdown {
            opacity: 1; 
            visibility: visible; 
            transform: translateX(-50%) translateY(0);
        }
        .social-dropdown a { 
            transition: all 0.3s ease; 
            text-decoration: none; 
            display: inline-block; 
        }
        .social-dropdown a:hover { 
            transform: scale(1.2); 
        }
        .social-dropdown img { 
            width: 32px; 
            height: 32px; 
            display: block; 
        }

        /* MAILING LIST POPUP */
        .mailing-list-popup {
            position: fixed;
            bottom: 40px;
            right: 40px;
            transform: translateX(0);
            background: #000;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            z-index: 1001;
            opacity: 1;
            visibility: visible;
            transition: all 0.8s ease;
            top: auto;
            left: auto;
        }
        .mailing-list-popup.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateX(600px);
        }
        .popup-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #FFFEF9;
            transition: color 0.3s ease;
            padding: 5px 10px;
            line-height: 1;
        }
        .popup-close:hover {
            color: #ddd;
        }
        .popup-title {
            font-family: "tomarik-brush", sans-serif;
            font-size: 1.8rem;
            color: #FFFEF9;
            display: block;
            margin: 0 0 10px 0;
            text-align: center;
            line-height: 1.3;
        }
        .popup-subtitle {
            font-family: "tomarik-brush", sans-serif;
            font-size: 1rem;
            color: #FFFEF9;
            display: block;
            margin: 0 0 20px 0;
            text-align: center;
            line-height: 1.4;
            font-weight: 300;
        }
        
        /* Disable clicking on content when popup is open */
        body.popup-open {
            overflow: hidden !important;
            position: fixed !important;
            width: 100% !important;
            height: 100% !important;
            top: 0 !important;
            left: 0 !important;
        }
        body.popup-open .main-container {
            position: fixed !important;
            width: 100% !important;
        }
        body.popup-open .content-overlay {
            pointer-events: none;
        }
        body.popup-open .main-title {
            pointer-events: none;
        }
        body.popup-open .tagline {
            pointer-events: none;
        }
        body.popup-open .tagline-section {
            pointer-events: none;
        }
        body.popup-open .social-wrapper {
            pointer-events: none;
        }
        
        .popup-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        .popup-form input {
            padding: 12px 15px;
            border: 1px solid #444;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            width: 300px;
            background: #2a2a2a;
            color: #FFFEF9;
            box-sizing: border-box;
        }
        .popup-form input:focus {
            outline: none;
            border-color: #FFFEF9;
            box-shadow: 0 0 0 3px rgba(255, 254, 249, 0.1);
        }
        .popup-form input::placeholder {
            color: #888;
        }
        .popup-submit {
            padding: 12px 40px;
            background: #FFFEF9;
            color: #1a1a1a;
            border: none;
            border-radius: 6px;
            font-family: "tomarik-brush", sans-serif;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: auto;
            height: auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .popup-submit:hover {
            background: #ddd;
            transform: translateY(-2px);
        }

        /* MOBILE */
        @media (max-width: 768px) {
            .content-overlay { 
                padding: 20px;
            }
            .social-wrapper {
                margin-bottom: 30px !important;
                transform: translateY(0) !important;
            }
            .social-dropdown { 
                position: static !important; 
                opacity: 1 !important; 
                visibility: visible !important; 
                transform: none !important; 
                margin-top: 20px;
                margin-bottom: 20px;
            }
            .mailing-list-popup {
                position: fixed !important;
                top: 30% !important;
                left: 50% !important;
                transform: translate(-50%, -50%) !important;
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
                width: 90%;
                max-width: 400px;
                padding: 30px 25px;
                margin: 0;
            }
            .mailing-list-popup.hidden {
                opacity: 0 !important;
                visibility: hidden !important;
                pointer-events: none !important;
            }
            .popup-title {
                display: block;
                margin-right: 0;
                margin-bottom: 15px;
            }
            .popup-form {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .popup-form input {
                width: 100%;
            }
            .tagline { 
                transform: translateY(0) !important; 
                flex-direction: column; 
                gap: 40px;
                margin-bottom: 40px !important;
                align-items: center !important;
            }
            .tagline-divider { 
                display: none; 
            }
            .dropdown-menu { 
                position: static; 
                margin-top: 10px; 
                opacity: 1; 
                visibility: visible; 
                transform: translateY(0); 
            }
        }
    </style>
</head>
<body>
    <div class="main-container" id="mainContainer">
        <div class="content-overlay">
            <div class="social-wrapper" style="margin-bottom: 8vh; transform: translateY(-100px);">
                <div class="social-dropdown">
                    <a href="https://www.tiktok.com/@anna.colliton" target="_blank" aria-label="Visit Anna's TikTok profile">
                        <img src="All Social Icons - Blobs-04.svg" alt="TikTok">
                    </a>
                    <a href="https://www.linkedin.com/in/annacolliton" target="_blank" aria-label="Visit Anna's LinkedIn profile">
                        <img src="All Social Icons - Blobs-01.svg" alt="LinkedIn">
                    </a>
                    <a href="https://www.instagram.com/annacolliton/" target="_blank" aria-label="Visit Anna's Instagram profile">
                        <img src="All Social Icons - Blobs-05.svg" alt="Instagram">
                    </a>
                    <a href="https://www.facebook.com/annacolliton" target="_blank" aria-label="Visit Anna's Facebook page">
                        <img src="All Social Icons - Blobs-02.svg" alt="Facebook">
                    </a>
                    <a href="https://www.etsy.com/shop/LittleArsonAnnie" target="_blank" aria-label="Visit Anna's Etsy shop">
                        <img src="All Social Icons - Blobs-03.svg" alt="Shop">
                    </a>
                </div>

                <h1 class="main-title">ANNA COLLITON</h1>
            </div>

            <!-- MAILING LIST POPUP MODAL -->
            <div class="mailing-list-popup hidden" id="mailingListPopup">
                <button class="popup-close" onclick="closeMailingListPopup()">×</button>
                <h2 class="popup-title">GET THE NEWS!</h2>
                <p class="popup-subtitle">Music and art in your inbox</p>
                <form class="popup-form" onsubmit="handleMailingListSubmit(event)">
                    <input 
                        type="email" 
                        placeholder="your email" 
                        required 
                        aria-label="Email address"
                    >
                    <button type="submit" class="popup-submit">Subscribe</button>
                </form>
            </div>

            <!-- TAGLINE / NAV -->
            <div class="tagline" style="transform: translateY(-200px); margin-bottom: 8vh;">
                <!-- MUSIC -->
                <div class="tagline-section">
                    <a href="https://annacollitonmusic.com/" target="_blank" style="text-decoration: none; color: inherit;">
                        <span>Music</span>
                    </a>
                    <div class="dropdown-menu">
                        <a href="https://annacollitonmusic.com/gigsandtours" target="_blank">gigs + tours</a>
                        <a href="https://annacollitonmusic.com/workshops-lessons" target="_blank">workshops + lessons</a>
                        <a href="https://annacollitonmusic.com/projects" target="_blank">Projects</a>
                        <a href="https://annacollitonmusic.com/epk" target="_blank">media + EPK</a>
                    </div>
                </div>

                <span class="tagline-divider">|</span>

                <!-- ART + DESIGN -->
                <div class="tagline-section">
                    <a href="https://annacollitonvisuals.com/logos-merch" target="_blank" style="text-decoration: none; color: inherit;">
                        <span>Art + Design</span>
                    </a>
                    <div class="dropdown-menu">
                        <a href="https://annacollitonvisuals.com/logos-merch" target="_blank">Logos + merch</a>
                        <a href="https://annacollitonvisuals.com/" target="_blank">albums + print design</a>
                        <a href="https://annacollitonvisuals.com/photography" target="_blank">Photography</a>
                    </div>
                </div>

                <span class="tagline-divider">|</span>

                <!-- SHOP -->
                <div class="tagline-section">
                    <a href="https://www.etsy.com/shop/LittleArsonAnnie" target="_blank" style="text-decoration: none; color: inherit;">
                        <span class="shop-button-text">
                            <span>STRAIGHT</span>
                            <span class="small-stack">
                                <span>TO</span>
                                <span>THE</span>
                            </span>
                            <span>SHOP!</span>
                            <span class="shop-arrow"></span>
                        </span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const MAILCHIMP_API_KEY = '91cc23856a4bfea1a178eb4432e24e18-us12';
        const MAILCHIMP_AUDIENCE_ID = '9cb5dfe3c7';
        const MAILCHIMP_SERVER = 'us12';

        function handleMailingListSubmit(event) {
            event.preventDefault();
            
            const form = event.target;
            const email = form.querySelector('input[type="email"]').value;
            const submitButton = form.querySelector('.popup-submit');
            
            // Disable button and show loading state
            submitButton.disabled = true;
            submitButton.textContent = 'Subscribing...';
            
            // Send to Mailchimp
            addToMailchimp(email, submitButton, form);
        }

        function addToMailchimp(email, submitButton, form) {
            // Mailchimp API endpoint
            const url = `https://${MAILCHIMP_SERVER}.api.mailchimp.com/3.0/lists/${MAILCHIMP_AUDIENCE_ID}/members`;
            
            const data = {
                email_address: email,
                status: 'subscribed'
            };
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Authorization': 'Basic ' + btoa('anystring:' + MAILCHIMP_API_KEY),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.id || data.status === 'subscribed') {
                    // Success!
                    alert('Thanks for subscribing! 🎉');
                    form.reset();
                    closeMailingListPopup();
                } else if (data.title === 'Member Exists') {
                    alert('You\'re already subscribed!');
                    closeMailingListPopup();
                } else {
                    alert('Something went wrong. Please try again.');
                    submitButton.disabled = false;
                    submitButton.textContent = 'Subscribe';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Something went wrong. Please try again.');
                submitButton.disabled = false;
                submitButton.textContent = 'Subscribe';
            });
        }

        function closeMailingListPopup() {
            const popup = document.getElementById('mailingListPopup');
            popup.classList.add('hidden');
            document.body.classList.remove('popup-open');
        }

        function openMailingListPopup() {
            const popup = document.getElementById('mailingListPopup');
            popup.classList.remove('hidden');
            document.body.classList.add('popup-open');
        }

        // Auto-open popup after 3 seconds
        window.addEventListener('load', function() {
            setTimeout(function() {
                openMailingListPopup();
            }, 3000);
        });

        // Close popup when clicking outside of it
        document.addEventListener('click', function(event) {
            const popup = document.getElementById('mailingListPopup');
            if (!popup.contains(event.target) && !event.target.closest('.social-wrapper')) {
                closeMailingListPopup();
            }
        });
    </script>
</body>
</html>
