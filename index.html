<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Anna Colliton</title>

    <!-- Adobe Font - tomarik-brush -->
    <link rel="stylesheet" href="https://use.typekit.net/ger2jgy.css">

    <!-- Google Font - Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* MAIN CONTAINER */
        .main-container {
            min-height: 100vh;
            position: relative;
            background-size: cover;
            background-position: center;
            background-color: #FFFEF9;
            transition: background-color 0.5s ease;
        }
        .main-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 248, 231, 0.3);
        }

        /* CONTENT */
        .content-overlay {
            position: relative; 
            z-index: 10; 
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            pointer-events: none;
        }

        /* TITLE */
        .main-title {
            font-family: "tomarik-brush", sans-serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            color: #000;
            margin-bottom: 40px;
            line-height: 1.1;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
            position: relative;
        }
        .main-title:hover { 
            transform: translateY(-3px); 
        }

        /* TAGLINE */
        .tagline {
            font-family: "tomarik-brush", sans-serif;
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: #000;
            display: flex; 
            gap: 20px; 
            align-items: flex-end; 
            justify-content: center;
            pointer-events: auto;
        }
        .tagline-section {
            position: relative; 
            cursor: pointer; 
            transition: all 0.3s ease;
            padding: 10px 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        .tagline-section:hover { 
            transform: translateY(-3px); 
        }
        .tagline-divider { 
            color: #333; 
            opacity: 0.7; 
            align-self: center;
        }

        /* SHOP BUTTON */
        .shop-button-text {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .shop-button-text .small-stack {
            display: flex;
            flex-direction: column;
            line-height: 0.85;
            font-size: clamp(0.6rem, 1.5vw, 1rem);
        }
        .shop-arrow {
            width: 0;
            height: 0;
            border-top: clamp(0.48rem, 1.2vw, 0.8rem) solid transparent;
            border-bottom: clamp(0.48rem, 1.2vw, 0.8rem) solid transparent;
            border-left: clamp(0.48rem, 1.2vw, 0.8rem) solid #000;
            margin-left: 5px;
            transform: translateY(4px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .tagline-section:hover .shop-arrow {
            opacity: 1;
        }

        /* DROPDOWN */
        .dropdown-menu {
            position: absolute;
            top: 100%;
            margin-top: 5px;
            padding: 10px 15px;
            padding-top: 15px;
            border-radius: 10px;
            opacity: 0; 
            visibility: hidden; 
            transform: translateY(-15px);
            transition: all 0.4s ease; 
            min-width: 200px; 
            text-align: center;
        }
        .tagline-section:hover .dropdown-menu {
            opacity: 1; 
            visibility: visible; 
            transform: translateY(0);
        }
        .dropdown-menu a {
            font-family: "tomarik-brush", sans-serif;
            font-size: clamp(0.95rem, 2vw, 1.25rem);
            color: #000; 
            text-decoration: none; 
            display: block; 
            padding: 8px 0;
            transition: all 0.3s ease; 
            white-space: nowrap;
        }
        .dropdown-menu a:hover { 
            transform: translateX(5px); 
            color: #555;
        }

        /* SOCIAL */
        .social-wrapper { 
            position: relative; 
            margin-bottom: 50px; 
            pointer-events: auto; 
        }
        .social-dropdown {
            position: absolute; 
            bottom: 100%; 
            left: 50%;
            transform: translateX(-50%) translateY(15px);
            opacity: 0; 
            visibility: hidden; 
            transition: all 0.4s ease;
            display: flex; 
            gap: 25px; 
            justify-content: center; 
            align-items: center;
            padding: 10px 0; 
            margin-bottom: 10px;
        }
        .social-wrapper:hover .social-dropdown {
            opacity: 1; 
            visibility: visible; 
            transform: translateX(-50%) translateY(0);
        }
        .social-dropdown a { 
            transition: all 0.3s ease; 
            text-decoration: none; 
            display: inline-block; 
        }
        .social-dropdown a:hover { 
            transform: scale(1.2); 
        }
        .social-dropdown img { 
            width: 32px; 
            height: 32px; 
            display: block; 
        }

        /* MAILING LIST POPUP */
        .mailing-list-popup {
            position: absolute;
            top: 50%;
            right: -350px;
            transform: translateY(-50%) scale(0.8);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            background: #FFFEF9;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            z-index: 100;
            pointer-events: none;
            white-space: nowrap;
            margin: 0;
        }
        .social-wrapper:hover .mailing-list-popup {
            opacity: 1;
            visibility: visible;
            transform: translateY(-50%) scale(0.8);
            pointer-events: auto;
        }
        .popup-title {
            font-family: "tomarik-brush", sans-serif;
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            color: #000;
            display: inline-block;
            margin-right: 20px;
            vertical-align: middle;
        }
        .popup-form {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            vertical-align: middle;
        }
        .popup-form input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            width: 200px;
        }
        .popup-form input:focus {
            outline: none;
            border-color: #000;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.1);
        }
        .popup-form input::placeholder {
            color: #aaa;
        }
        .popup-submit {
            padding: 8px 16px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-family: "tomarik-brush", sans-serif;
            font-size: clamp(0.8rem, 2vw, 1rem);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .popup-submit:hover {
            background: #333;
            transform: translateY(-2px);
        }

        /* MOBILE */
        @media (max-width: 768px) {
            .content-overlay { 
                padding: 20px;
            }
            .social-wrapper {
                margin-bottom: 30px !important;
                transform: translateY(0) !important;
            }
            .social-dropdown { 
                position: static !important; 
                opacity: 1 !important; 
                visibility: visible !important; 
                transform: none !important; 
                margin-top: 20px;
                margin-bottom: 20px;
            }
            .mailing-list-popup {
                position: static !important;
                opacity: 1 !important;
                visibility: visible !important;
                transform: none !important;
                pointer-events: auto !important;
                white-space: normal;
                padding: 20px;
                margin-top: 20px;
            }
            .popup-title {
                display: block;
                margin-right: 0;
                margin-bottom: 15px;
            }
            .popup-form {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .popup-form input {
                width: 100%;
            }
            .tagline { 
                transform: translateY(0) !important; 
                flex-direction: column; 
                gap: 40px;
                margin-bottom: 40px !important;
                align-items: center !important;
            }
            .tagline-divider { 
                display: none; 
            }
            .dropdown-menu { 
                position: static; 
                margin-top: 10px; 
                opacity: 1; 
                visibility: visible; 
                transform: translateY(0); 
            }
        }
    </style>
</head>
<body>
    <div class="main-container" id="mainContainer">
        <div class="content-overlay">
            <div class="social-wrapper" style="margin-bottom: 8vh; transform: translateY(-100px);">
                <div class="social-dropdown">
                    <a href="https://www.linkedin.com/in/annacolliton" target="_blank" aria-label="Visit Anna's LinkedIn profile">
                        <img src="All Social Icons - Blobs-01.svg" alt="LinkedIn">
                    </a>
                    <a href="https://www.tiktok.com/@anna.colliton" target="_blank" aria-label="Visit Anna's TikTok profile">
                        <img src="All Social Icons - Blobs-04.svg" alt="TikTok">
                    </a>
                    <a href="https://www.instagram.com/annacolliton/" target="_blank" aria-label="Visit Anna's Instagram profile">
                        <img src="All Social Icons - Blobs-05.svg" alt="Instagram">
                    </a>
                    <a href="https://www.facebook.com/annacolliton" target="_blank" aria-label="Visit Anna's Facebook page">
                        <img src="All Social Icons - Blobs-02.svg" alt="Facebook">
                    </a>
                    <a href="https://www.etsy.com/shop/LittleArsonAnnie" target="_blank" aria-label="Visit Anna's Etsy shop">
                        <img src="All Social Icons - Blobs-03.svg" alt="Shop">
                    </a>
                </div>

                <!-- MAILING LIST POPUP -->
                <div class="mailing-list-popup">
                    <h2 class="popup-title">updates in your inbox!</h2>
                    <form class="popup-form" onsubmit="handleMailingListSubmit(event)">
                        <input 
                            type="email" 
                            placeholder="Your email" 
                            required 
                            aria-label="Email address"
                        >
                        <button type="submit" class="popup-submit">Subscribe</button>
                    </form>
                </div>

                <h1 class="main-title">ANNA COLLITON</h1>
            </div>

            <!-- TAGLINE / NAV -->
            <div class="tagline" style="transform: translateY(-200px); margin-bottom: 8vh;">
                <!-- ART + DESIGN -->
                <div class="tagline-section">
                    <a href="https://annacollitonvisuals.com/logos-merch" target="_blank" style="text-decoration: none; color: inherit;">
                        <span>Art + Design</span>
                    </a>
                    <div class="dropdown-menu">
                        <a href="https://annacollitonvisuals.com/logos-merch" target="_blank">Logos + merch</a>
                        <a href="https://annacollitonvisuals.com/" target="_blank">albums + print design</a>
                        <a href="https://annacollitonvisuals.com/photography" target="_blank">Photography</a>
                    </div>
                </div>

                <span class="tagline-divider">|</span>

                <!-- MUSIC -->
                <div class="tagline-section">
                    <a href="https://annacollitonmusic.com/" target="_blank" style="text-decoration: none; color: inherit;">
                        <span>Music</span>
                    </a>
                    <div class="dropdown-menu">
                        <a href="https://annacollitonmusic.com/gigsandtours" target="_blank">gigs + tours</a>
                        <a href="https://annacollitonmusic.com/workshops-lessons" target="_blank">workshops + lessons</a>
                        <a href="https://annacollitonmusic.com/projects" target="_blank">Projects</a>
                        <a href="https://annacollitonmusic.com/epk" target="_blank">media + EPK</a>
                    </div>
                </div>

                <span class="tagline-divider">|</span>

                <!-- SHOP -->
                <div class="tagline-section">
                    <a href="https://www.etsy.com/shop/LittleArsonAnnie" target="_blank" style="text-decoration: none; color: inherit;">
                        <span class="shop-button-text">
                            <span>STRAIGHT</span>
                            <span class="small-stack">
                                <span>TO</span>
                                <span>THE</span>
                            </span>
                            <span>SHOP!</span>
                            <span class="shop-arrow"></span>
                        </span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleMailingListSubmit(event) {
            event.preventDefault();
            
            const form = event.target;
            const email = form.querySelector('input[type="email"]').value;
            
            // Replace this with your actual mailing list integration
            // Examples: Mailchimp, ConvertKit, EmailOctopus, etc.
            console.log('Email submitted:', email);
            
            // Show success message (optional)
            alert('Thanks for subscribing! 🎉');
            
            // Clear the form
            form.reset();
        }

        function closeSocialPopup() {
            const popup = document.querySelector('.mailing-list-popup');
            popup.style.opacity = '0';
            popup.style.visibility = 'hidden';
        }
    </script>
</body>
</html>
