<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Anna Colliton</title>

    <!-- Adobe Font - tomarik-brush -->
    <link rel="stylesheet" href="https://use.typekit.net/ger2jgy.css">

    <!-- Google Font - Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* MAIN CONTAINER */
        .main-container {
            min-height: 100vh;
            position: relative;
            background-size: cover;
            background-position: center;
            background-color: #FFFEF9;
            transition: background-color 0.5s ease;
        }
        .main-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: transparent;
            transition: background 0.3s ease;
        }

        /* CONTENT */
        .content-overlay {
            position: relative; 
            z-index: 10; 
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            pointer-events: none;
        }

        /* TITLE */
        .main-title {
            font-family: "tomarik-brush", sans-serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            color: #000;
            margin-bottom: 40px;
            line-height: 1.1;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
            position: relative;
        }
        .main-title:hover { 
            transform: translateY(-3px); 
        }

        /* TAGLINE */
        .tagline {
            font-family: "tomarik-brush", sans-serif;
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: #000;
            display: flex; 
            gap: 20px; 
            align-items: flex-end; 
            justify-content: center;
            pointer-events: auto;
        }
        .tagline-section {
            position: relative; 
            cursor: pointer; 
            transition: all 0.3s ease;
            padding: 15px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            border-radius: 8px;
            background: transparent;
        }
        .tagline-section:hover { 
            transform: translateY(-3px); 
        }
        .tagline-divider { 
            color: #333; 
            opacity: 0.7; 
            align-self: center;
        }

        /* SHOP BUTTON */
        .shop-button-text {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .shop-button-text .small-stack {
            display: flex;
            flex-direction: column;
            line-height: 0.85;
            font-size: clamp(0.6rem, 1.5vw, 1rem);
        }
        .shop-arrow {
            width: 0;
            height: 0;
            border-top: clamp(0.48rem, 1.2vw, 0.8rem) solid transparent;
            border-bottom: clamp(0.48rem, 1.2vw, 0.8rem) solid transparent;
            border-left: clamp(0.48rem, 1.2vw, 0.8rem) solid #000;
            margin-left: 5px;
            transform: translateY(4px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .tagline-section:hover .shop-arrow {
            opacity: 1;
        }

        /* DROPDOWN */
        .dropdown-menu {
            position: absolute;
            top: 100%;
            margin-top: 5px;
            padding: 10px 15px;
            padding-top: 15px;
            border-radius: 10px;
            opacity: 0; 
            visibility: hidden; 
            transform: translateY(-15px);
            transition: all 0.4s ease; 
            min-width: 200px; 
            text-align: center;
        }
        .tagline-section:hover .dropdown-menu {
            opacity: 1; 
            visibility: visible; 
            transform: translateY(0);
        }
        .dropdown-menu a {
            font-family: "tomarik-brush", sans-serif;
            font-size: clamp(0.95rem, 2vw, 1.25rem);
            color: #000; 
            text-decoration: none; 
            display: block; 
            padding: 8px 0;
            transition: all 0.3s ease; 
            white-space: nowrap;
        }
        .dropdown-menu a:hover { 
            transform: translateX(5px); 
            color: #555;
        }

        /* SOCIAL */
        .social-wrapper { 
            position: relative; 
            margin-bottom: 50px; 
            pointer-events: auto; 
        }
        .social-wrapper:hover .social-dropdown {
            opacity: 1; 
            visibility: visible; 
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        .social-dropdown {
            position: absolute; 
            bottom: 100%; 
            left: 50%;
            transform: translateX(-50%) translateY(0);
            opacity: 1; 
            visibility: visible; 
            transition: all 0.4s ease;
            display: flex; 
            gap: 15px; 
            justify-content: center; 
            align-items: center;
            padding: 10px 0; 
            margin-bottom: 10px;
            white-space: nowrap;
            pointer-events: auto;
        }
        .social-dropdown a { 
            transition: all 0.3s ease; 
            text-decoration: none; 
            display: inline-block; 
        }
        .social-dropdown a:hover { 
            transform: scale(1.2); 
        }
        .social-dropdown img { 
            width: 32px; 
            height: 32px; 
            display: block; 
        }

        /* MAILING LIST POPUP */
        .mailing-list-popup {
            position: fixed;
            bottom: 40px;
            right: 40px;
            transform: translateX(0);
            background: #000;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            z-index: 1001;
            opacity: 1;
            visibility: visible;
            transition: all 0.8s ease;
            top: auto;
            left: auto;
            pointer-events: auto;
        }
        .mailing-list-popup.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateX(600px);
        }
        .popup-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #FFFEF9;
            transition: color 0.3s ease;
            padding: 5px 10px;
            line-height: 1;
        }
        .popup-close:hover {
            color: #ddd;
        }
        .popup-title {
            font-family: "tomarik-brush", sans-serif;
            font-size: 1.8rem;
            color: #FFFEF9;
            display: block;
            margin: 0 0 5px 0;
            text-align: center;
            line-height: 1.3;
        }
        .popup-subtitle {
            font-family: "tomarik-brush", sans-serif;
            font-size: 1rem;
            color: #FFFEF9;
            display: block;
            margin: 0 0 8px 0;
            margin-top: -8px;
            text-align: center;
            line-height: 1.4;
            font-weight: 300;
        }
        
        /* Disable clicking on content when popup is open */
        body.popup-open {
            overflow: hidden !important;
        }
        
        .popup-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        .popup-form input {
            padding: 12px 15px;
            border: 1px solid #444;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            width: 300px;
            background: #2a2a2a;
            color: #FFFEF9;
            box-sizing: border-box;
            pointer-events: auto;
        }
        .popup-form input:focus {
            outline: none;
            border-color: #FFFEF9;
            box-shadow: 0 0 0 3px rgba(255, 254, 249, 0.1);
        }
        .popup-form input::placeholder {
            color: #888;
        }
        .popup-submit {
            padding: 12px 40px;
            background: #FFFEF9;
            color: #1a1a1a;
            border: none;
            border-radius: 6px;
            font-family: "tomarik-brush", sans-serif;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: auto;
            height: auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }
        .popup-submit:hover {
            background: #ddd;
            transform: translateY(-2px);
        }

        /* MOBILE */
        @media (max-width: 768px) {
            .content-overlay { 
                padding: 20px;
                padding-top: 240px;
            }
            .main-container {
                background-color: #FFFEF9 !important;
            }
            .main-title {
                color: #000 !important;
            }
            .tagline-section a {
                color: #000 !important;
            }
            .tagline-divider {
                color: #333 !important;
            }
            .social-dropdown img {
                filter: none !important;
                opacity: 1 !important;
            }
            .shop-arrow {
                border-left-color: #000 !important;
            }
            .social-wrapper {
                margin-bottom: 30px !important;
                transform: translateY(0) !important;
            }
            .social-dropdown { 
                position: static !important; 
                opacity: 1 !important; 
                visibility: visible !important; 
                transform: none !important; 
                margin-top: 20px;
                margin-bottom: 20px;
            }
            .mailing-list-popup {
                position: fixed !important;
                top: 20px !important;
                left: 50% !important;
                transform: translate(-50%, 0) !important;
                opacity: 1 !important;
                visibility: visible !important;
                pointer-events: auto !important;
                width: 90%;
                max-width: 400px;
                padding: 20px 20px 5px 20px !important;
                margin: 0 !important;
                height: auto !important;
                max-height: 220px !important;
                overflow: hidden !important;
            }
            .mailing-list-popup * {
                pointer-events: auto !important;
            }
            .mailing-list-popup.hidden {
                opacity: 0 !important;
                visibility: hidden !important;
                pointer-events: none !important;
            }
            .popup-title {
                display: block;
                margin-right: 0;
                margin-bottom: 5px;
                margin-top: 0;
                padding: 0;
            }
            .popup-subtitle {
                margin-bottom: 20px !important;
                padding: 0;
            }
            .popup-form {
                display: flex;
                flex-direction: column;
                gap: 20px;
                padding: 0 !important;
                margin: 0 !important;
                margin-bottom: 0 !important;
            }
            .popup-form input {
                width: 100%;
                margin: 0 !important;
            }
            .popup-submit {
                margin: 0 !important;
                padding: 10px 30px !important;
                margin-bottom: 0 !important;
                transform: scale(0.85) translateY(-10px);
            }
            .popup-close {
                display: none !important;
            }
            .tagline { 
                transform: translateY(0) !important; 
                flex-direction: column; 
                gap: 40px;
                margin-bottom: 40px !important;
                align-items: center !important;
            }
            .tagline-divider { 
                display: none; 
            }
            .dropdown-menu { 
                position: static; 
                margin-top: 10px; 
                opacity: 1; 
                visibility: visible; 
                transform: translateY(0); 
            }
        }
    </style>
</head>
<body>
    <div class="main-container" id="mainContainer">
        <div class="content-overlay">
            <div class="social-wrapper" style="margin-bottom: 8vh; transform: translateY(-100px);">
                <div class="social-dropdown">
                    <a href="https://www.tiktok.com/@anna.colliton" target="_blank" aria-label="Visit Anna's TikTok profile">
                        <img src="All Social Icons - Blobs-04.svg" alt="TikTok">
                    </a>
                    <a href="https://www.linkedin.com/in/annacolliton" target="_blank" aria-label="Visit Anna's LinkedIn profile">
                        <img src="All Social Icons - Blobs-01.svg" alt="LinkedIn">
                    </a>
                    <a href="https://www.instagram.com/annacolliton/" target="_blank" aria-label="Visit Anna's Instagram profile">
                        <img src="All Social Icons - Blobs-05.svg" alt="Instagram">
                    </a>
                    <a href="https://www.facebook.com/annacolliton" target="_blank" aria-label="Visit Anna's Facebook page">
                        <img src="All Social Icons - Blobs-02.svg" alt="Facebook">
                    </a>
                    <a href="https://www.etsy.com/shop/LittleArsonAnnie" target="_blank" aria-label="Visit Anna's Etsy shop">
                        <img src="All Social Icons - Blobs-03.svg" alt="Shop">
                    </a>
                </div>

                <h1 class="main-title">ANNA COLLITON</h1>
            </div>

            <!-- MAILING LIST POPUP MODAL -->
            <div class="mailing-list-popup hidden" id="mailingListPopup">
                <button class="popup-close" onclick="closeMailingListPopup()">×</button>
                <h2 class="popup-title">GET THE NEWS!</h2>
                <p class="popup-subtitle">Music and art in your inbox</p>
                <form class="popup-form" onsubmit="handleMailingListSubmit(event)">
                    <input 
                        type="email" 
                        placeholder="Email" 
                        required 
                        aria-label="Email address"
                    >
                    <button type="submit" class="popup-submit">Subscribe</button>
                </form>
            </div>

            <!-- TAGLINE / NAV -->
            <div class="tagline" style="transform: translateY(-200px); margin-bottom: 8vh;">
                <!-- MUSIC -->
                <div class="tagline-section">
                    <a href="https://annacollitonmusic.com/" target="_blank" style="text-decoration: none; color: inherit;">
                        <span>Music</span>
                    </a>
                    <div class="dropdown-menu">
                        <a href="https://annacollitonmusic.com/gigsandtours" target="_blank">gigs + tours</a>
                        <a href="https://annacollitonmusic.com/workshops-lessons" target="_blank">workshops + lessons</a>
                        <a href="https://annacollitonmusic.com/projects" target="_blank">Projects</a>
                        <a href="https://annacollitonmusic.com/epk" target="_blank">media + EPK</a>
                    </div>
                </div>

                <span class="tagline-divider">|</span>

                <!-- ART + DESIGN -->
                <div class="tagline-section">
                    <a href="https://annacollitonvisuals.com/logos-merch" target="_blank" style="text-decoration: none; color: inherit;">
                        <span>Art + Design</span>
                    </a>
                    <div class="dropdown-menu">
                        <a href="https://annacollitonvisuals.com/logos-merch" target="_blank">Logos + merch</a>
                        <a href="https://annacollitonvisuals.com/" target="_blank">albums + print design</a>
                        <a href="https://annacollitonvisuals.com/photography" target="_blank">Photography</a>
                    </div>
                </div>

                <span class="tagline-divider">|</span>

                <!-- SHOP -->
                <div class="tagline-section">
                    <a href="https://www.etsy.com/shop/LittleArsonAnnie" target="_blank" style="text-decoration: none; color: inherit;">
                        <span class="shop-button-text">
                            <span>STRAIGHT</span>
                            <span class="small-stack">
                                <span>TO</span>
                                <span>THE</span>
                            </span>
                            <span>SHOP!</span>
                            <span class="shop-arrow"></span>
                        </span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const FORMSPREE_ID = 'xeeznykn';
        const defaultBG = '#FFFEF9';
        const colors = {
            music: '#1B4D0E',      // Rich dark green
            art: '#1A3A52',        // Rich dark blue
            shop: '#8B2F0A'        // Deeper rich dark orange
        };

        // Add hover listeners to tagline sections
        const taglineSections = document.querySelectorAll('.tagline-section');
        const taglineContainer = document.querySelector('.tagline');
        const mainTitle = document.querySelector('.main-title');
        const socialWrapper = document.querySelector('.social-wrapper');
        const creamColor = '#FFFEF9';
        const blackColor = '#000';
        let currentColor = defaultBG;
        let hasHoveredMenu = false;

        taglineSections.forEach((section, index) => {
            section.addEventListener('mouseenter', () => {
                hasHoveredMenu = true;
                if (index === 0) { // Music
                    currentColor = colors.music;
                } else if (index === 1) { // Art + Design
                    currentColor = colors.art;
                } else if (index === 2) { // Shop
                    currentColor = colors.shop;
                }
                applyColorChange(currentColor);
            });
        });

        function applyColorChange(color) {
            const mainContainer = document.querySelector('.main-container');
            mainContainer.style.backgroundColor = color;
            
            // Change all text to cream when background is colored
            document.querySelector('.main-title').style.color = creamColor;
            // Change dividers to cream
            document.querySelectorAll('.tagline-divider').forEach(divider => {
                divider.style.color = creamColor;
            });
            // Change menu text to cream
            document.querySelectorAll('.tagline-section a').forEach(a => {
                a.style.color = creamColor;
            });
            // Change social icons to cream
            document.querySelectorAll('.social-dropdown img').forEach(img => {
                img.style.filter = 'brightness(0) invert(1)';
                img.style.opacity = '0.9';
            });
            // Change shop arrow to cream
            document.querySelectorAll('.shop-arrow').forEach(arrow => {
                arrow.style.borderLeftColor = creamColor;
            });
        }

        function resetToDefault() {
            // Only reset if we've never hovered over the menu
            if (!hasHoveredMenu) {
                const mainContainer = document.querySelector('.main-container');
                mainContainer.style.backgroundColor = defaultBG;
                document.querySelector('.main-title').style.color = blackColor;
                // Reset dividers to default
                document.querySelectorAll('.tagline-divider').forEach(divider => {
                    divider.style.color = '';
                });
                // Reset menu text
                document.querySelectorAll('.tagline-section a').forEach(a => {
                    a.style.color = 'inherit';
                });
                // Reset social icons
                document.querySelectorAll('.social-dropdown img').forEach(img => {
                    img.style.filter = '';
                    img.style.opacity = '';
                });
                // Reset shop arrow
                document.querySelectorAll('.shop-arrow').forEach(arrow => {
                    arrow.style.borderLeftColor = '';
                });
                currentColor = defaultBG;
            }
        }

        // Create a zone that includes the header, buttons, and social icons
        const interactiveZone = document.querySelector('.content-overlay');
        
        interactiveZone.addEventListener('mouseleave', (e) => {
            // Only reset if we're truly leaving the zone area AND haven't hovered menu yet
            const contentOverlay = document.querySelector('.content-overlay');
            const rect = contentOverlay.getBoundingClientRect();
            
            if ((e.clientY < rect.top || e.clientY > rect.bottom ||
                e.clientX < rect.left || e.clientX > rect.right) && !hasHoveredMenu) {
                resetToDefault();
            }
        });

        interactiveZone.addEventListener('mouseenter', () => {
            // Keep the current color when re-entering the zone
        });

        function handleMailingListSubmit(event) {
            event.preventDefault();
            
            const form = event.target;
            const email = form.querySelector('input[type="email"]').value;
            const submitButton = form.querySelector('.popup-submit');
            
            // Disable button and show loading state
            submitButton.disabled = true;
            submitButton.textContent = 'Subscribing...';
            
            // Send to Formspree
            addToFormspree(email, submitButton, form);
        }

        function addToFormspree(email, submitButton, form) {
            const url = `https://formspree.io/f/${FORMSPREE_ID}`;
            
            const data = {
                email: email,
                message: 'New subscriber from Anna Colliton website'
            };
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    // Success!
                    alert('Thanks for subscribing! 🎉');
                    form.reset();
                    closeMailingListPopup();
                } else {
                    alert('Something went wrong. Please try again.');
                    submitButton.disabled = false;
                    submitButton.textContent = 'Subscribe';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Something went wrong. Please try again.');
                submitButton.disabled = false;
                submitButton.textContent = 'Subscribe';
            });
        }

        function closeMailingListPopup() {
            const popup = document.getElementById('mailingListPopup');
            popup.classList.add('hidden');
            document.body.classList.remove('popup-open');
        }

        function openMailingListPopup() {
            const popup = document.getElementById('mailingListPopup');
            popup.classList.remove('hidden');
            document.body.classList.add('popup-open');
        }

        // Auto-open popup immediately on page load
        window.addEventListener('load', function() {
            openMailingListPopup();
        });

        // Close popup when clicking the X button only
        // Removed click-outside-to-close to prevent accidental closing while typing
    </script>
</body>
</html>
